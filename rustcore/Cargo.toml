[workspace]
resolver = "2"
members = ["domain", "providers", "import", "playback", "sync", "data", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", features = ["mp3", "aac", "isomp4", "ogg", "flac", "wav", "alac"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
ring = "0.17"
aes-gcm = "0.10"
uniffi = "0.28"
strsim = "0.11"
unicode-normalization = "0.1"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
url = "2.5"
futures = "0.3"
rand = "0.8"
